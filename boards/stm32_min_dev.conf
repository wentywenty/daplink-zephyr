# Blue Pill (STM32F103C8T6) - minimal DAPLink configuration
# HID (CMSIS-DAP) only, optimized for 64KB Flash / 20KB RAM

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER=y

# HID (CMSIS-DAP)
CONFIG_USBD_HID_SUPPORT=y

# CDC ACM (serial bridge)
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# UART Bridge
CONFIG_UART_BRIDGE=y

# Disable MSC drag-and-drop (resource constrained)
CONFIG_DAPLINK_MSC_FLASH=n
CONFIG_USBD_MSC_CLASS=n
CONFIG_DISK_ACCESS=n

# Basic
CONFIG_GPIO=y
CONFIG_SERIAL=y

# Aggressive size optimization
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

# Disable logging (saves ~5-8KB Flash + ~2KB RAM)
CONFIG_LOG=n

# Disable console (saves ~2KB Flash)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Optimize for size
CONFIG_COMPILER_OPT="-Os"
