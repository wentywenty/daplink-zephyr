# NUCLEO-F103RB (STM32F103RB, 128KB Flash / 20KB RAM)
# Minimal DAPLink configuration: HID (CMSIS-DAP) + CDC, no MSC.
#
# The default prj.conf enables the 32KB in-RAM MSC disk image, which does not
# fit in the F103's 20KB of RAM. Disable it here (same reason stm32_min_dev
# disables MSC). This board/overlay exists for build verification.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER=y

# HID (CMSIS-DAP)
CONFIG_USBD_HID_SUPPORT=y

# CDC ACM (serial bridge)
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_BRIDGE=y

# Disable MSC drag-and-drop (resource constrained, 20KB RAM)
CONFIG_DAPLINK_MSC_FLASH=n
CONFIG_USBD_MSC_CLASS=n
CONFIG_DISK_ACCESS=n

# Disable JTAG (Flash constrained, SWD only)
CONFIG_DAPLINK_JTAG=n

# Basic
CONFIG_GPIO=y
CONFIG_SERIAL=y

# Aggressive size optimization
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

# Disable logging/console (saves Flash + RAM)
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_COMPILER_OPT="-Os"
