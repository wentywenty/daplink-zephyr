# Black Magic Debug - Zephyr (daplink-zephyr) OTA / DFU via MCUboot.
#
# This file is only used for sysbuild builds:
#   west build --sysbuild -b black_f407ve .
#
# MCUboot provides serial recovery and/or USB DFU for updating the probe.
# The normal (single-image) build ignores this file.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
