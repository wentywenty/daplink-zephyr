# DAPLink GPIO binding - SWD/JTAG debug probe pins

description: DAPLink SWD/JTAG debug probe GPIO pins

compatible: "daplink,gpio"

properties:
  swclk-gpios:
    type: phandle-array
    required: true
    description: SWCLK/TCK output pin

  swdio-gpios:
    type: phandle-array
    required: true
    description: SWDIO/TMS bidirectional data pin

  swdio-in-gpios:
    type: phandle-array
    required: false
    description: Optional separate SWDIO input pin

  nreset-gpios:
    type: phandle-array
    required: false
    description: Target nRESET pin (open-drain)

  tdi-gpios:
    type: phandle-array
    required: false
    description: JTAG TDI output pin (optional; enables JTAG mode)

  tdo-gpios:
    type: phandle-array
    required: false
    description: JTAG TDO input pin (optional; enables JTAG mode)
